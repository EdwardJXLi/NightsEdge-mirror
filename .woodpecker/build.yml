depends_on: []

when:
  - event: push
    branch: main
  # Manual runs are allowed from any branch
  - event: [manual, tag]

labels:
  platform: linux/amd64

steps:
  - name: fetch-source
    image: alpine:latest
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      - apk add --no-cache git bash curl python3
      - bash scripts/fetch-source.sh

  # --- x86_64 build ---

  - name: build-linux-x86_64
    image: ubuntu:24.04
    environment:
      BUILD_X86_64: "true"
      SCCACHE_VERSION: "0.16.0"
      SCCACHE_DISABLE: 0
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      SCCACHE_BUCKET: nightsedge-cache
      SCCACHE_ENDPOINT: s3.hydranet.dev
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      - apt-get update && apt-get install -y python3 git curl mercurial ca-certificates tar xz-utils bzip2
      - |
        curl -fsSL -o /tmp/sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl.tar.gz"
        tar -xzf /tmp/sccache.tar.gz -C /tmp
        install -m 0755 "/tmp/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
        sccache --version
      - |
        if [ "$${BUILD_X86_64:-true}" != "true" ]; then
          echo "==> Skipping linux-x86_64 build (BUILD_X86_64=$${BUILD_X86_64:-unset})"
          exit 0
        fi
        bash scripts/build.sh linux-x86_64

  - name: package-linux-x86_64
    image: ubuntu:24.04
    environment:
      UPDATE_URL_BASE: https://nightsedge.hydranet.dev
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      - apt-get update && apt-get install -y xz-utils zip unzip
      - |
        OBJ_DIR="$(find mozilla-release -maxdepth 1 -name 'obj-x86_64-pc-linux-gnu' -type d | head -1)"
        if [ -z "$OBJ_DIR" ]; then
          echo "==> Skipping linux-x86_64 package step because no build output was found"
          exit 0
        fi
        bash scripts/generate-mar.sh linux-x86_64 "$UPDATE_URL_BASE"
      - bash scripts/stage-package.sh linux-x86_64

  # --- aarch64 build ---

  - name: build-linux-aarch64
    image: ubuntu:24.04
    environment:
      BUILD_AARCH64: "true"
      SCCACHE_VERSION: "0.16.0"
      SCCACHE_DISABLE: 0
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      SCCACHE_BUCKET: nightsedge-cache
      SCCACHE_ENDPOINT: s3.hydranet.dev
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      - apt-get update && apt-get install -y python3 git curl mercurial ca-certificates tar xz-utils bzip2
      - |
        curl -fsSL -o /tmp/sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl.tar.gz"
        tar -xzf /tmp/sccache.tar.gz -C /tmp
        install -m 0755 "/tmp/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
        sccache --version
      - |
        if [ "$${BUILD_AARCH64:-true}" != "true" ]; then
          echo "==> Skipping linux-aarch64 build (BUILD_AARCH64=$${BUILD_AARCH64:-unset})"
          exit 0
        fi
        bash scripts/build.sh linux-aarch64

  - name: package-linux-aarch64
    image: ubuntu:24.04
    environment:
      UPDATE_URL_BASE: https://nightsedge.hydranet.dev
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      - apt-get update && apt-get install -y xz-utils zip unzip
      - |
        OBJ_DIR="$(find mozilla-release -maxdepth 1 -name 'obj-aarch64-unknown-linux-gnu' -type d | head -1)"
        if [ -z "$OBJ_DIR" ]; then
          echo "==> Skipping linux-aarch64 package step because no build output was found"
          exit 0
        fi
        bash scripts/generate-mar.sh linux-aarch64 "$UPDATE_URL_BASE"
      - bash scripts/stage-package.sh linux-aarch64

  # --- Windows x86_64 cross build ---

  - name: build-windows-x86_64
    image: ubuntu:24.04
    environment:
      BUILD_WINDOWS_X86_64: "true"
      SCCACHE_VERSION: "0.16.0"
      SCCACHE_DISABLE: 0
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      SCCACHE_BUCKET: nightsedge-cache
      SCCACHE_ENDPOINT: s3.hydranet.dev
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      # msitools: get_vs.py SDK extraction; libc6-i386: Mozilla's wine build
      - apt-get update && apt-get install -y python3 git curl mercurial ca-certificates tar xz-utils bzip2 zip unzip msitools libc6-i386
      - |
        curl -fsSL -o /tmp/sccache.tar.gz "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl.tar.gz"
        tar -xzf /tmp/sccache.tar.gz -C /tmp
        install -m 0755 "/tmp/sccache-v$SCCACHE_VERSION-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
        sccache --version
      - |
        if [ "$${BUILD_WINDOWS_X86_64:-true}" != "true" ]; then
          echo "==> Skipping windows-x86_64 build (BUILD_WINDOWS_X86_64=$${BUILD_WINDOWS_X86_64:-unset})"
          exit 0
        fi
        bash scripts/build.sh windows-x86_64

  - name: package-windows-x86_64
    image: ubuntu:24.04
    environment:
      UPDATE_URL_BASE: https://nightsedge.hydranet.dev
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      - apt-get update && apt-get install -y xz-utils zip unzip
      - |
        OBJ_DIR="$(find mozilla-release -maxdepth 1 -name 'obj-x86_64-pc-windows-msvc' -type d | head -1)"
        if [ -z "$OBJ_DIR" ]; then
          echo "==> Skipping windows-x86_64 package step because no build output was found"
          exit 0
        fi
        bash scripts/generate-mar.sh windows-x86_64 "$UPDATE_URL_BASE"
      - bash scripts/stage-package.sh windows-x86_64

  # --- upload all architectures ---

  - name: upload-forgejo-release
    image: woodpeckerci/plugin-release:latest
    settings:
      base_url: https://forgejo.hydranet.dev
      api_key:
        from_secret: FORGEJO_RELEASE_TOKEN
      files:
        - artifacts/linux-x86_64/*.tar.*
        - artifacts/linux-x86_64/*.txt
        - artifacts/linux-x86_64/mar/*.mar
        - artifacts/linux-x86_64/mar/*.xml
        - artifacts/linux-aarch64/*.tar.*
        - artifacts/linux-aarch64/*.txt
        - artifacts/linux-aarch64/mar/*.mar
        - artifacts/linux-aarch64/mar/*.xml
        - artifacts/windows-x86_64/*.zip
        - artifacts/windows-x86_64/*.exe
        - artifacts/windows-x86_64/*.txt
        - artifacts/windows-x86_64/mar/*.mar
        - artifacts/windows-x86_64/mar/*.xml
    when:
      - event: tag

  # Manual-run convenience mirror for local testing
  - name: upload-artifacts-s3
    image: ubuntu:24.04
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      SCCACHE_BUCKET: nightsedge-cache
      SCCACHE_ENDPOINT: s3.hydranet.dev
    commands:
      - 'echo "==> Runner architecture: $(uname -m)"'
      - apt-get update && apt-get install -y curl zip
      - curl -fsSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc && chmod +x /usr/local/bin/mc
      - mc alias set cache "https://$SCCACHE_ENDPOINT" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
      - |
        if [ -z "$(find artifacts -type f 2>/dev/null)" ]; then
          echo "==> No artifacts found to upload, skipping"
          exit 0
        fi
        ZIP_NAME="nightsedge-artifacts-$CI_PIPELINE_NUMBER.zip"
        zip -r "/tmp/$ZIP_NAME" artifacts
        mc cp "/tmp/$ZIP_NAME" "cache/$SCCACHE_BUCKET/.artifacts/$ZIP_NAME"
        echo "==> Uploaded s3://$SCCACHE_BUCKET/.artifacts/$ZIP_NAME"
    when:
      - event: manual
