depends_on: []

when:
  - event: push
    branch: main
    path:
      include:
        - website/**
        - .woodpecker/website.yml
  # Allow rebuilding or testing the image without changing the website.
  - event: manual

labels:
  platform: linux/amd64

steps:
  # This Dockerfile has no RUN instructions, so Kaniko can assemble the ARM64
  # filesystem on the x86_64 runner without QEMU or privileged execution.
  - name: publish-website-amd64
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: registry.hydranet.dev
      repo:
        from_secret: WEBSITE_CONTAINER_REPOSITORY
      username:
        from_secret: CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: CONTAINER_REGISTRY_PASSWORD
      context: website
      dockerfile: website/Dockerfile
      tags:
        - ${CI_COMMIT_SHA}-amd64
      extra_opts: --custom-platform=linux/amd64

  - name: publish-website-arm64
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: registry.hydranet.dev
      repo:
        from_secret: WEBSITE_CONTAINER_REPOSITORY
      username:
        from_secret: CONTAINER_REGISTRY_USERNAME
      password:
        from_secret: CONTAINER_REGISTRY_PASSWORD
      context: website
      dockerfile: website/Dockerfile
      tags:
        - ${CI_COMMIT_SHA}-arm64
      extra_opts: --custom-platform=linux/arm64

  - name: publish-website-manifest
    image: gcr.io/go-containerregistry/crane:debug
    # Crane's debug image has BusyBox but no /bin/sh. Decode Woodpecker's
    # generated command script with the shell included in the image.
    entrypoint:
      - /busybox/sh
      - -c
      - echo "$CI_SCRIPT" | /busybox/base64 -d | /busybox/sh -e
    environment:
      WEBSITE_CONTAINER_REPOSITORY:
        from_secret: WEBSITE_CONTAINER_REPOSITORY
      CONTAINER_REGISTRY_USERNAME:
        from_secret: CONTAINER_REGISTRY_USERNAME
      CONTAINER_REGISTRY_PASSWORD:
        from_secret: CONTAINER_REGISTRY_PASSWORD
    commands:
      - |
        IMAGE="registry.hydranet.dev/$WEBSITE_CONTAINER_REPOSITORY"
        printf '%s' "$CONTAINER_REGISTRY_PASSWORD" |
          crane auth login registry.hydranet.dev \
            --username "$CONTAINER_REGISTRY_USERNAME" \
            --password-stdin
        crane index append \
          --manifest "$IMAGE:$CI_COMMIT_SHA-amd64" \
          --manifest "$IMAGE:$CI_COMMIT_SHA-arm64" \
          --tag "$IMAGE:$CI_COMMIT_SHA"
        crane tag "$IMAGE:$CI_COMMIT_SHA" latest
