server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Keep downloads and update files on the NightsEdge origin while MinIO
    # stores the static objects. The bucket only needs anonymous read access.
    location /releases/ {
        proxy_ssl_server_name on;
        proxy_set_header Host s3.hydranet.dev;
        proxy_pass https://s3.hydranet.dev/nightsedge-releases/releases/;
    }

    location /mar/ {
        proxy_ssl_server_name on;
        proxy_set_header Host s3.hydranet.dev;
        proxy_pass https://s3.hydranet.dev/nightsedge-releases/mar/;
    }

    location /updates/ {
        proxy_ssl_server_name on;
        proxy_set_header Host s3.hydranet.dev;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        proxy_pass https://s3.hydranet.dev/nightsedge-releases/updates/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
